AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Daily AI News Bot - X/YouTube -> Claude -> Slack

Parameters:
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Description: Anthropic API Key for Claude
  SlackWebhookUrl:
    Type: String
    NoEcho: true
    Description: Slack Incoming Webhook URL
  NotifyHourUTC:
    Type: Number
    Default: 23
    Description: Hour (UTC) to send daily report. 23 UTC = 8 JST

Globals:
  Function:
    Timeout: 300
    MemorySize: 256
    Runtime: python3.12
    Environment:
      Variables:
        ANTHROPIC_API_KEY: !Ref AnthropicApiKey
        SLACK_WEBHOOK_URL: !Ref SlackWebhookUrl
        S3_BUCKET: !Ref StateBucket

Resources:
  StateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "ai-news-bot-state-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules:
          - Id: CleanupOldState
            Status: Enabled
            ExpirationInDays: 90

  NewsBot:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ai-news-bot
      CodeUri: src/
      Handler: main.handler
      Description: Collect AI news from X/YouTube and send to Slack
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref StateBucket
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: !Sub "cron(0 ${NotifyHourUTC} * * ? *)"
            Description: Daily AI news report
            Enabled: true

Outputs:
  FunctionArn:
    Value: !GetAtt NewsBot.Arn
  StateBucketName:
    Value: !Ref StateBucket
