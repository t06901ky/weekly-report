# 監視するXアカウント (ユーザー名のみ、@なし)
x_accounts:
  - sama                    # Sam Altman
  - ylecun                  # Yann LeCun
  - karpathy                # Andrej Karpathy
  - demishassabis            # Demis Hassabis
  - AnthropicAI             # Anthropic
  - OpenAI                  # OpenAI
  - GoogleDeepMind          # Google DeepMind
  # 必要に応じて追加してください

# 監視するYouTubeチャンネル (@ハンドル or チャンネルID UC... どちらも可)
youtube_channels:
  - keitoaiweb    # @keitoaiweb
  - mikimikiweb   # @mikimikiweb
  - iketomo-ch    # @iketomo-ch
  # 追加例: UCbmNph6atAoGfqLoCL_duAg  (チャンネルIDも使用可)

# Nitter インスタンス (複数指定すると自動フォールバック)
nitter_instances:
  - https://nitter.net
  - https://nitter.privacydev.net
  - https://nitter.poast.org

# フィルタリング設定
filter:
  # AIニュースとして判定するキーワード (日本語・英語)
  keywords:
    - AI
    - artificial intelligence
    - machine learning
    - deep learning
    - LLM
    - GPT
    - Claude
    - Gemini
    - ChatGPT
    - neural network
    - transformer
    - diffusion
    - AGI
    - 人工知能
    - 機械学習
    - 生成AI

# スケジュール設定 (GitHub Actions の cron で管理)
# 毎日 23:00 UTC = 08:00 JST に実行
# .github/workflows/daily-ai-news.yml を参照
